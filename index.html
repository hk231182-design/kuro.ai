f<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KURO AI</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080c12;
    color: white;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #8d98a5;
    margin-bottom: 25px;
}

.card {
    background: #111821;
    border: 1px solid #202b38;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

.card h3 {
    margin: 0 0 15px;
    font-size: 14px;
    color: #9da8b5;
    letter-spacing: 1px;
}

select {
    width: 100%;
    padding: 14px;
    border: 1px solid #293746;
    border-radius: 10px;
    background: #18222d;
    color: white;
    font-size: 16px;
    outline: none;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.value {
    font-size: 30px;
    font-weight: bold;
}

.signal-box {
    font-size: 34px;
    font-weight: bold;
    text-align: center;
    padding: 10px 0;
}

.status {
    text-align: center;
    color: #8d98a5;
    margin-top: 5px;
}

.market-status {
    font-size: 24px;
    font-weight: bold;
}

canvas {
    display: block;
    width: 100%;
    height: 260px;
    background: #0a0f15;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #00c878;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.note {
    text-align: center;
    color: #687481;
    font-size: 12px;
    margin-top: 15px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }
}
</style></head><body><div class="container"><h1>KURO AI</h1>

<div class="subtitle">
    AI Trading Signal Dashboard
</div>

<div class="card">
    <h3>SELECT ASSET</h3>

    <select id="assetSelect">
        <option value="EUR/USD">EUR/USD</option>
        <option value="GBP/USD">GBP/USD</option>
        <option value="USD/JPY">USD/JPY</option>
        <option value="AUD/USD">AUD/USD</option>
        <option value="USD/CAD">USD/CAD</option>
    </select>
</div>

<div class="grid">

    <div class="card">
        <h3>CURRENT PRICE</h3>
        <div class="value" id="currentPrice">
            Loading...
        </div>
    </div>

    <div class="card">
        <h3>KURO AI SIGNAL</h3>

        <div class="signal-box" id="signalBox">
            WAIT
        </div>

        <div class="status" id="status">
            System Ready
        </div>
    </div>

    <div class="card">
        <h3>CONFIDENCE</h3>

        <div class="value" id="confidence">
            --%
        </div>
    </div>

    <div class="card">
        <h3>MARKET STATUS</h3>

        <div class="market-status" id="marketStatus">
            Connecting...
        </div>
    </div>

</div>

<div class="card">
    <h3>PRICE CHART</h3>

    <canvas
        id="priceChart"
        width="800"
        height="260">
    </canvas>
</div>

<div class="card">

    <button id="generateButton">
        GENERATE SIGNAL
    </button>

    <div class="note">
        Demo / educational signal system
    </div>

</div>

</div><script>

const assetSelect = document.getElementById("assetSelect");
const currentPrice = document.getElementById("currentPrice");
const signalBox = document.getElementById("signalBox");
const status = document.getElementById("status");
const confidence = document.getElementById("confidence");
const marketStatus = document.getElementById("marketStatus");
const generateButton = document.getElementById("generateButton");
const chart = document.getElementById("priceChart");
const ctx = chart.getContext("2d");

const symbols = {
    "EUR/USD": "EURUSD",
    "GBP/USD": "GBPUSD",
    "USD/JPY": "USDJPY",
    "AUD/USD": "AUDUSD",
    "USD/CAD": "USDCAD"
};

let priceHistory = [];
let lastPrice = null;
let loading = false;

function formatPrice(price) {
    if (price >= 100) {
        return price.toFixed(3);
    }

    return price.toFixed(5);
}

async function updatePrice() {

    if (loading) {
        return;
    }

    loading = true;

    const symbol = symbols[assetSelect.value];

    try {

        const response = await fetch(
            "https://biquote.io/api/" + symbol,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("API Error");
        }

        const data = await response.json();

        if (typeof data.mid !== "number") {
            throw new Error("Price unavailable");
        }

        const newPrice = data.mid;

        lastPrice = newPrice;

        currentPrice.textContent = formatPrice(newPrice);

        priceHistory.push(newPrice);

        if (priceHistory.length > 30) {
            priceHistory.shift();
        }

        marketStatus.textContent = "LIVE";

        drawChart();
        analyzeMarket();

    } catch (error) {

        console.log("Price API error:", error);

        if (lastPrice !== null) {

            currentPrice.textContent =
                formatPrice(lastPrice);

            marketStatus.textContent =
                "LAST PRICE";

        } else {

            currentPrice.textContent =
                "Unavailable";

            marketStatus.textContent =
                "OFFLINE";
        }

        signalBox.textContent = "WAIT";

        status.textContent =
            "Price Data Unavailable";

        confidence.textContent = "--%";
    }

    loading = false;
}

function analyzeMarket() {

    if (priceHistory.length < 10) {

        signalBox.textContent = "WAIT";
        status.textContent = "Collecting Market Data";
        confidence.textContent = "--%";

        return;
    }

    const prices = priceHistory;

    const latest = prices[prices.length - 1];
    const previous = prices[prices.length - 2];

    const shortTermStart =
        prices[prices.length - 5];

    const mediumTermStart =
        prices[prices.length - 10];

    let score = 0;

    const shortMove =
        ((latest - shortTermStart) / shortTermStart) * 100;

    const mediumMove =
        ((latest - mediumTermStart) / mediumTermStart) * 100;

    const lastMove =
        ((latest - previous) / previous) * 100;


    // Short-term momentum
    if (shortMove > 0.005) {
        score += 1;
    }

    if (shortMove < -0.005) {
        score -= 1;
    }


    // Medium-term momentum
    if (mediumMove > 0.01) {
        score += 2;
    }

    if (mediumMove < -0.01) {
        score -= 2;
    }


    // Latest movement
    if (lastMove > 0) {
        score += 1;
    }

    if (lastMove < 0) {
        score -= 1;
    }


    // Signal decision
    if (score >= 3) {

        signalBox.textContent = "CALL";
        status.textContent = "Bullish Momentum";

    } else if (score <= -3) {

        signalBox.textContent = "PUT";
        status.textContent = "Bearish Momentum";

    } else {

        signalBox.textContent = "WAIT";
        status.textContent = "Market Unclear";
    }


    // Confidence
    let confidenceValue =
        50 + Math.abs(score) * 10;

    if (confidenceValue > 90) {
        confidenceValue = 90;
    }

    confidence.textContent =
        confidenceValue + "%";
  // Save signal to Recent Signals
if (signalBox.textContent === "CALL" || signalBox.textContent === "PUT") {
    const history = document.getElementById("signalHistory");

    const item = document.createElement("div");
    item.textContent = signalBox.textContent + " • " + new Date().toLocaleTimeString();

    history.prepend(item);
}  
}
function drawChart() {

    ctx.clearRect(
        0,
        0,
        chart.width,
        chart.height
    );

    if (priceHistory.length < 2) {
        return;
    }

    const min =
        Math.min(...priceHistory);

    const max =
        Math.max(...priceHistory);

    const range =
        max - min || 1;

    ctx.beginPath();

    priceHistory.forEach(
        (price, index) => {

            const x =
                (index /
                (priceHistory.length - 1)) *
                chart.width;

            const y =
                chart.height -
                ((price - min) / range) *
                (chart.height - 20) -
                10;

            if (index === 0) {

                ctx.moveTo(x, y);

            } else {

                ctx.lineTo(x, y);
            }
        }
    );

    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;
    ctx.stroke();

    const lastIndex =
        priceHistory.length - 1;

    const lastX = chart.width;

    const lastY =
        chart.height -
        ((priceHistory[lastIndex] - min) / range) *
        (chart.height - 20) -
        10;

    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();
}

assetSelect.addEventListener(
    "change",
    function () {

        priceHistory = [];
        lastPrice = null;

        currentPrice.textContent =
            "Loading...";

        marketStatus.textContent =
            "Connecting...";

        signalBox.textContent =
            "WAIT";

        status.textContent =
            "Collecting Market Data";

        confidence.textContent =
            "--%";

        drawChart();

        updatePrice();
    }
);

generateButton.addEventListener(
    "click",
    function () {

        analyzeMarket();
        drawChart();
    }
);

updatePrice();

setInterval(
    updatePrice,
    5000
);

</script> 
    <div class="card">

    <h3>RECENT SIGNALS</h3>

    <div id="signalHistory">
        No signals yet
    </div>

</div>
</body>
</html>
