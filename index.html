<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KURO AI</title>

<style>

/* =========================
   KURO AI BASE STYLE
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #102a5c 0%,
            #07152f 35%,
            #020817 75%
        );

    color: white;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 36px;

    color: #4db8ff;

    text-shadow:
        0 0 10px rgba(0, 174, 255, 0.55),
        0 0 20px rgba(0, 110, 255, 0.25);
}

.subtitle {
    text-align: center;
    color: #8d98a5;
    margin-bottom: 25px;
}

.card {
    background: rgba(10, 22, 42, 0.90);

    border: 1px solid #19395d;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 18px;

    box-shadow:
        0 0 15px rgba(0, 120, 255, 0.06);
}

.card h3 {
    margin: 0 0 15px;

    color: #8fcfff;

    letter-spacing: 1px;
}

select {
    width: 100%;

    padding: 14px;

    border: 1px solid #24527c;

    border-radius: 10px;

    background: #08182f;

    color: white;

    font-size: 16px;

    outline: none;
}

select:focus {
    border-color: #168cff;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}

.value {
    font-size: 30px;

    font-weight: bold;

    color: #eaf7ff;
}

.signal-box {
    font-size: 34px;

    font-weight: bold;

    text-align: center;

    padding: 10px 0;

    border-radius: 12px;

    margin-top: 10px;

    background: #07162c;

    border: 1px solid #24527c;

    box-shadow:
        0 0 12px rgba(0, 140, 255, 0.08);
}

.status {
    text-align: center;

    color: #8d98a5;

    margin-top: 5px;
}

.market-status {
    font-size: 24px;

    font-weight: bold;

    color: #4db8ff;

    text-shadow:
        0 0 8px rgba(0, 174, 255, 0.35);
}

canvas {
    display: block;

    width: 100%;

    height: 260px;

    background: #030d20;

    border-radius: 10px;

    border: 1px solid #19395d;
}

button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #006eff,
            #00aaff
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 12px rgba(0, 140, 255, 0.20);
}

button:hover {
    opacity: 0.92;
}

.note {
    text-align: center;

    color: #687481;

    font-size: 12px;

    margin-top: 15px;
}


/* =========================
   CONFIDENCE
========================= */

.confidence-bar {
    width: 100%;

    height: 8px;

    background: #07162c;

    border: 1px solid #19395d;

    border-radius: 10px;

    overflow: hidden;

    margin-top: 10px;
}

.confidence-fill {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #0077ff,
            #00c8ff
        );

    border-radius: 10px;

    transition:
        width 0.4s ease;
}


/* =========================
   ACCURACY
========================= */

#accuracyTracker {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 15px;

    text-align: center;
}

#accuracyTracker > div {
    background: #07162c;

    border: 1px solid #19395d;

    border-radius: 10px;

    padding: 12px 5px;

    font-size: 13px;

    color: #8d98a5;
}

#accuracyTracker span {
    display: block;

    margin-top: 5px;

    font-size: 20px;

    font-weight: bold;

    color: white;
}


/* =========================
   COUNTDOWN
========================= */

#countdownTimer {
    color: #4db8ff !important;

    text-shadow:
        0 0 8px rgba(0, 174, 255, 0.35);
}


/* =========================
   SIGNAL HISTORY
========================= */

#signalHistory {
    margin-top: 15px;

    color: #b7c7d8;

    font-size: 14px;

    line-height: 1.8;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    #accuracyTracker {
        grid-template-columns:
            1fr 1fr 1fr;

        gap: 6px;
    }

    #accuracyTracker > div {
        padding: 10px 3px;

        font-size: 12px;
    }

    #accuracyTracker span {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>KURO AI</h1>

<div class="subtitle"></div>


<!-- SELECT ASSET -->

<div class="card">

    <h3>SELECT ASSET</h3>

    <select id="assetSelect">

        <option value="EUR/USD">
            EUR/USD
        </option>

        <option value="GBP/USD">
            GBP/USD
        </option>

        <option value="USD/JPY">
            USD/JPY
        </option>

        <option value="AUD/USD">
            AUD/USD
        </option>

        <option value="USD/CAD">
            USD/CAD
        </option>

    </select>

</div>


<!-- MAIN GRID -->

<div class="grid">


    <!-- CURRENT PRICE -->

    <div class="card">

        <h3>CURRENT PRICE</h3>

        <div
            class="value"
            id="currentPrice"
        >
            Loading...
        </div>

    </div>


    <!-- SIGNAL -->

    <div class="card">

        <h3>KURO AI SIGNAL</h3>

        <div
            class="signal-box"
            id="signalBox"
        >
            WAIT
        </div>

        <div
            class="status"
            id="status"
        >
            System Ready
        </div>

    </div>


    <!-- CONFIDENCE -->

    <div class="card">

        <h3>CONFIDENCE</h3>

        <div
            class="value"
            id="confidence"
        >
            --%
        </div>

        <div class="confidence-bar">

            <div
                class="confidence-fill"
                id="confidenceFill"
            ></div>

        </div>

    </div>


    <!-- MARKET STATUS -->

    <div class="card">

        <h3>MARKET STATUS</h3>

        <div
            class="market-status"
            id="marketStatus"
        >
            Connecting...
        </div>

    </div>

</div>


<!-- PRICE CHART -->

<div class="card">

    <h3>PRICE CHART</h3>

    <canvas
        id="priceChart"
        width="800"
        height="260"
    ></canvas>

</div>


<!-- GENERATE -->

<div class="card">

    <button id="generateButton">
        GENERATE SIGNAL
    </button>

    <div class="note">
        Demo / educational signal system
    </div>

</div>


<!-- RECENT SIGNALS -->

<div class="card">

    <h3>RECENT SIGNALS</h3>


    <!-- COUNTDOWN -->

    <div
        id="countdownTimer"
        style="
            text-align:center;
            font-size:20px;
            font-weight:bold;
            margin-bottom:10px;
        "
    >
        TIME LEFT: --
    </div>


    <!-- ACCURACY -->

    <div id="accuracyTracker">

        <div>
            WINS:
            <span id="winsCount">
                0
            </span>
        </div>

        <div>
            LOSSES:
            <span id="lossesCount">
                0
            </span>
        </div>

        <div>
            DRAWS:
            <span id="drawsCount">
                0
            </span>
        </div>

        <div>
            ACCURACY:
            <span id="accuracyValue">
                0%
            </span>
        </div>

    </div>


    <!-- HISTORY -->

    <div id="signalHistory">

        No signals yet

    </div>

</div>

</div>


<script>

/* =========================
   KURO AI VARIABLES
========================= */

const assetSelect =
    document.getElementById("assetSelect");

const currentPrice =
    document.getElementById("currentPrice");

const signalBox =
    document.getElementById("signalBox");

const status =
    document.getElementById("status");

const confidence =
    document.getElementById("confidence");

const marketStatus =
    document.getElementById("marketStatus");

const generateButton =
    document.getElementById("generateButton");

const chart =
    document.getElementById("priceChart");

const ctx =
    chart.getContext("2d");


/* =========================
   ASSETS
========================= */

const symbols = {

    "EUR/USD": "EURUSD",

    "GBP/USD": "GBPUSD",

    "USD/JPY": "USDJPY",

    "AUD/USD": "AUDUSD",

    "USD/CAD": "USDCAD"

};


/* =========================
   VARIABLES
========================= */

let priceHistory = [];

let lastPrice = null;

let loading = false;

let lastCandleMinute = null;

let totalWins = 0;

let totalLosses = 0;

let totalDraws = 0;


/* =========================
   PRICE FORMAT
========================= */

function formatPrice(price) {

    if (price >= 100) {

        return price.toFixed(3);

    }

    return price.toFixed(5);

}


/* =========================
   UPDATE PRICE
========================= */

async function updatePrice() {

    if (loading) {
        return;
    }

    loading = true;

    const symbol =
        symbols[assetSelect.value];

    try {

        const response =
            await fetch(
                "https://biquote.io/api/" + symbol,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "API Error"
            );

        }

        const data =
            await response.json();

        console.log(
            "KURO API DATA:",
            data
        );


        if (
            typeof data.mid !== "number"
        ) {

            throw new Error(
                "Price unavailable"
            );

        }


        const newPrice =
            data.mid;


        lastPrice =
            newPrice;


        currentPrice.textContent =
            formatPrice(newPrice);


        priceHistory.push(
            newPrice
        );


        if (
            priceHistory.length > 30
        ) {

            priceHistory.shift();

        }


        marketStatus.textContent =
            "LIVE";


        drawChart();


        /* =========================
           CHECK PREVIOUS SIGNAL
        ========================= */

        if (
            window.lastSavedSignal &&
            window.lastSignalPrice &&
            window.lastSignalTime &&
            Date.now() -
            window.lastSignalTime >= 60000
        ) {

            const signal =
                window.lastSavedSignal;

            const signalPrice =
                window.lastSignalPrice;

            let result = "DRAW";


            if (signal === "CALL") {

                if (
                    newPrice > signalPrice
                ) {

                    result = "WIN";

                } else if (
                    newPrice < signalPrice
                ) {

                    result = "LOSS";

                }

            }


            else if (signal === "PUT") {

                if (
                    newPrice < signalPrice
                ) {

                    result = "WIN";

                } else if (
                    newPrice > signalPrice
                ) {

                    result = "LOSS";

                }

            }


            /* =========================
               UPDATE RESULT COUNTER
            ========================= */

            if (result === "WIN") {

                totalWins++;

            }

            else if (result === "LOSS") {

                totalLosses++;

            }

            else {

                totalDraws++;

            }


            const totalResults =
                totalWins +
                totalLosses +
                totalDraws;


            let accuracy = 0;


            if (
                totalResults > 0
            ) {

                accuracy =
                    (
                        totalWins /
                        totalResults
                    ) * 100;

            }


            document.getElementById(
                "winsCount"
            ).textContent =
                totalWins;


            document.getElementById(
                "lossesCount"
            ).textContent =
                totalLosses;


            document.getElementById(
                "drawsCount"
            ).textContent =
                totalDraws;


            document.getElementById(
                "accuracyValue"
            ).textContent =
                accuracy.toFixed(1) + "%";


            /* =========================
               HISTORY RESULT
            ========================= */

            const history =
                document.getElementById(
                    "signalHistory"
                );


            const resultItem =
                document.createElement(
                    "div"
                );


            resultItem.textContent =
                signal +
                " → " +
                result;


            history.prepend(
                resultItem
            );


            window.lastSavedSignal =
                null;

            window.lastSignalPrice =
                null;

            window.lastSignalTime =
                null;

        }


        analyzeMarket();


    }

    catch (error) {

        console.log(
            "Price API error:",
            error
        );


        if (
            lastPrice !== null
        ) {

            currentPrice.textContent =
                formatPrice(lastPrice);

            marketStatus.textContent =
                "LAST PRICE";

        }

        else {

            currentPrice.textContent =
                "Unavailable";

            marketStatus.textContent =
                "OFFLINE";

        }


        signalBox.textContent =
            "WAIT";


        status.textContent =
            "Price Data Unavailable";


        confidence.textContent =
            "--%";

    }


    loading = false;

}


/* =========================
   COUNTDOWN
========================= */

setInterval(
    function () {

        const timer =
            document.getElementById(
                "countdownTimer"
            );


        if (!window.signalExpiry) {

            timer.textContent =
                "TIME LEFT: --";

            return;

        }


        const remaining =
            Math.max(
                0,
                window.signalExpiry -
                Date.now()
            );


        const seconds =
            Math.ceil(
                remaining / 1000
            );


        if (seconds > 0) {

            const minutes =
                Math.floor(
                    seconds / 60
                );


            const secs =
                seconds % 60;


            timer.textContent =
                "TIME LEFT: " +
                String(minutes)
                    .padStart(2, "0") +
                ":" +
                String(secs)
                    .padStart(2, "0");

        }

        else {

            timer.textContent =
                "TIME LEFT: 00:00";

        }

    },
    1000
);


/* =========================
   MARKET ANALYSIS
========================= */

function analyzeMarket() {


    if (
        priceHistory.length < 12
    ) {

        signalBox.textContent =
            "WAIT";

        status.textContent =
            "Collecting 1-Min Data";

        confidence.textContent =
            "--%";

        return;

    }


    const prices =
        priceHistory;


    const candlePrices =
        prices.slice(-12);


    const open =
        candlePrices[0];


    const close =
        candlePrices[
            candlePrices.length - 1
        ];


    const high =
        Math.max(
            ...candlePrices
        );


    const low =
        Math.min(
            ...candlePrices
        );


    const candleMove =
        (
            (close - open) /
            open
        ) * 100;


    const range =
        (
            (high - low) /
            open
        ) * 100;


    let score = 0;


    /* 1-MINUTE DIRECTION */

    if (
        candleMove > 0.005
    ) {

        score += 2;

    }


    if (
        candleMove < -0.005
    ) {

        score -= 2;

    }


    /* CANDLE STRENGTH */

    if (
        range > 0.01
    ) {

        if (
            close > open
        ) {

            score += 1;

        }


        if (
            close < open
        ) {

            score -= 1;

        }

    }


    /* RECENT MOMENTUM */

    const previous =
        prices[
            prices.length - 2
        ];


    const lastMove =
        (
            (close - previous) /
            previous
        ) * 100;


    if (
        lastMove > 0
    ) {

        score += 1;

    }


    if (
        lastMove < 0
    ) {

        score -= 1;

    }


    /* =========================
       SIGNAL DECISION
    ========================= */

    let newSignal =
        "WAIT";

    let newStatus =
        "Market Unclear";


    const currentMinute =
        Math.floor(
            Date.now() / 60000
        );


    if (
        lastCandleMinute === null
    ) {

        lastCandleMinute =
            currentMinute;

    }


    if (
        currentMinute !==
        lastCandleMinute
    ) {

        lastCandleMinute =
            currentMinute;


        if (
            score >= 3
        ) {

            newSignal =
                "CALL";

            newStatus =
                "1-Min Bullish";

        }

        else if (
            score <= -3
        ) {

            newSignal =
                "PUT";

            newStatus =
                "1-Min Bearish";

        }

    }


    signalBox.textContent =
        newSignal;


    /* SIGNAL COLOR */

    if (
        newSignal === "CALL"
    ) {

        signalBox.style.color =
            "#00c878";

    }

    else if (
        newSignal === "PUT"
    ) {

        signalBox.style.color =
            "#ff4d4d";

    }

    else {

        signalBox.style.color =
            "white";

    }


    status.textContent =
        newStatus;


    /* =========================
       CONFIDENCE
    ========================= */

    let confidenceValue =
        50 +
        Math.abs(score) * 10;


    if (
        confidenceValue > 90
    ) {

        confidenceValue =
            90;

    }


    confidence.textContent =
        confidenceValue + "%";


    const confidenceFill =
        document.getElementById(
            "confidenceFill"
        );


    confidenceFill.style.width =
        confidenceValue + "%";


    /* =========================
       SAVE NEW SIGNAL
    ========================= */

    if (
        (
            newSignal === "CALL" ||
            newSignal === "PUT"
        )
        &&
        newSignal !==
        window.lastSavedSignal
    ) {


        const history =
            document.getElementById(
                "signalHistory"
            );


        const item =
            document.createElement(
                "div"
            );


        const entryTime =
            new Date()
                .toLocaleTimeString();


        const expiryTime =
            new Date(
                Date.now() + 60000
            )
            .toLocaleTimeString();


        window.signalExpiry =
            Date.now() + 60000;


        item.textContent =
            newSignal +
            " • ENTRY: " +
            entryTime +
            " • EXPIRY: " +
            expiryTime;


        history.prepend(
            item
        );


        window.lastSavedSignal =
            newSignal;


        window.lastSignalPrice =
            close;


        window.lastSignalTime =
            Date.now();

    }

}


/* =========================
   DRAW CHART
========================= */

function drawChart() {


    ctx.clearRect(
        0,
        0,
        chart.width,
        chart.height
    );


    if (
        priceHistory.length < 2
    ) {

        return;

    }


    const min =
        Math.min(
            ...priceHistory
        );


    const max =
        Math.max(
            ...priceHistory
        );


    const range =
        max - min || 1;


    ctx.beginPath();


    priceHistory.forEach(
        function (
            price,
            index
        ) {


            const x =
                (
                    index /
                    (
                        priceHistory.length - 1
                    )
                ) *
                chart.width;


            const y =
                chart.height -
                (
                    (
                        price - min
                    ) /
                    range
                ) *
                (
                    chart.height - 20
                ) -
                10;


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#00aaff";

    ctx.lineWidth =
        3;

    ctx.stroke();


    /* LAST PRICE DOT */

    const lastIndex =
        priceHistory.length - 1;


    const lastX =
        chart.width;


    const lastY =
        chart.height -
        (
            (
                priceHistory[
                    lastIndex
                ] - min
            ) /
            range
        ) *
        (
            chart.height - 20
        ) -
        10;


    ctx.beginPath();


    ctx.arc(
        lastX,
        lastY,
        5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

}


/* =========================
   ASSET CHANGE
========================= */

assetSelect.addEventListener(
    "change",
    function () {


        priceHistory = [];

        lastPrice = null;

        lastCandleMinute = null;


        currentPrice.textContent =
            "Loading...";


        marketStatus.textContent =
            "Connecting...";


        signalBox.textContent =
            "WAIT";


        signalBox.style.color =
            "white";


        status.textContent =
            "Collecting Market Data";


        confidence.textContent =
            "--%";


        document.getElementById(
            "confidenceFill"
        ).style.width =
            "0%";


        drawChart();


        updatePrice();

    }
);


/* =========================
   GENERATE BUTTON
========================= */

generateButton.addEventListener(
    "click",
    function () {

        analyzeMarket();

        drawChart();

    }
);


/* =========================
   START
========================= */

updatePrice();


setInterval(
    updatePrice,
    5000
);

</script>

</body>
</html>
